<main><section class="category-products"><div class="section-shell"><div id="productNotFound" class="empty-product-message" hidden>This product is no longer available.</div><div id="productPageContent" class="sa-product-detail"><div id="productGallery"></div><div class="product-detail-copy"><p class="eyebrow" id="productCategory"></p><h1 id="productName"></h1><p id="productPrice" class="sa-detail-price"></p><p id="productDescription"></p><p id="productStatus" class="sa-detail-status"></p><a id="productWhatsApp" class="product-order-link" target="_blank" rel="noopener">Order via WhatsApp →</a></div></div></div></section></main>
<script src="../data/config.js"></script><script src="../data/products.js"></script><script src="../script.js"></script><script src="../data/simple-gallery.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{
 const id=new URLSearchParams(location.search).get("id");
 const p=(window.SHOKHER_ALNA_PRODUCTS||[]).find(x=>String(x.id).toLowerCase()===String(id||"").toLowerCase());
 const content=document.getElementById("productPageContent"),nf=document.getElementById("productNotFound");
 if(!p){content.hidden=true;nf.hidden=false;return}
 const info=window.getShokherStatusInfo(p);
 if(!info.visible){content.hidden=true;nf.hidden=false;return}
 document.title=p.name+" | Shokher Alna";
 productName.textContent=p.name;productCategory.textContent=(p.category||"").replaceAll("-"," ");productPrice.textContent=p.price?"$"+p.price:"Contact for price";productDescription.textContent=p.description||"";productStatus.textContent=info.message;
 if(info.orderAllowed){productWhatsApp.href=window.buildWhatsAppOrderUrl(p)}else{productWhatsApp.hidden=true}
 if(window.shokherRenderSimpleGallery)await window.shokherRenderSimpleGallery(p);
});
</script><style>.sa-product-detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:48px;align-items:start}.sa-detail-price{font-size:1.35rem;font-weight:700;margin:18px 0}.sa-detail-status{font-weight:700;margin:18px 0}@media(max-width:800px){.sa-product-detail{grid-template-columns:1fr}}</style></body></html>
